<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Pokemon Cards Listing with Estimated Price"
    />
    <title>WDD330: Set</title>
    <script type="module" src="./js/set.js"></script>
  </head>
  <body>
    <div id="app">
      <header class="navigation-menu">
        <a href="./index.html">WDD330</a>
        <ul>
          <li>
            <a href="./siteplan.html">Site Plan</a>
          </li>
        </ul>
      </header>
      <main>
        <h1>List of Cards</h1>
        <div class="card-set-details"></div>
        <ul id="list-set" class="list-set"></ul>
        <template id="set-placeholder-template">
          <li class="set-item placeholder" aria-hidden="true">
            <div class="set-image placeholder-block"></div>
            <div class="set-details">
              <span class="placeholder-line placeholder-title"></span>
              <span class="placeholder-line"></span>
            </div>
          </li>
        </template>
        <div id="pagination" class="pagination">
          <button id="prev-paginate" class="pagination-button" disabled>
            <svg
              xmlns="http://www.w3.org/2000/svg"
              fill="none"
              viewBox="0 0 24 24"
              stroke-width="1.5"
              stroke="currentColor"
              class="size-6"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="m11.25 9-3 3m0 0 3 3m-3-3h7.5M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z"
              />
            </svg>
            Prev
          </button>
          <button id="next-paginate" class="pagination-button">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              fill="none"
              viewBox="0 0 24 24"
              stroke-width="1.5"
              stroke="currentColor"
              class="size-6"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="m12.75 15 3-3m0 0-3-3m3 3h-7.5M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z"
              />
            </svg>
            Next
          </button>
        </div>
        <dialog id="image-modal" class="image-modal">
          <div class="modal-content">
            <h2>Set Card</h2>
            <p id="modal-image"></p>
            <button id="closeModalBtn">Close</button>
          </div>
        </dialog>
      </main>
      <footer>
        <p>&copy; 2026 Mario Brino</p>
      </footer>
    </div>
  </body>
</html>
